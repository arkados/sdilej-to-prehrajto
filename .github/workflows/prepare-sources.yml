name: prepare-sources

on:
  workflow_dispatch:
    inputs:
      priority_film_ids:
        description: Comma-separated film IDs for an explicit deep review
        type: string
        default: ''
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: sdilej-to-prehrajto-source-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.CONTINUOUS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      HF_HOME: /tmp/huggingface
      # One fast worker and two deep workers, with one CPU thread per model.
      WHISPER_DEEP_MODEL: medium
      WHISPER_CPU_THREADS: "1"
      WHISPER_NUM_WORKERS: "1"
      PRIORITY_FILM_IDS: ${{ inputs.priority_film_ids || '' }}
      SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
      SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: whisper-small-medium-${{ runner.os }}-v2
      - name: Verify or install media runtime
        timeout-minutes: 12
        run: python3 scripts/ensure_media_runtime.py
      - name: Install preparation runtime
        timeout-minutes: 10
        run: |
          pip install ".[whisper]"
      - name: Verify real Whisper runtime before scanning films
        run: python scripts/check_whisper_runtime.py
      - name: Verify migrated uploads and pending target guards
        run: python -m sdilej_to_prehrajto.migration
      - name: Configure durable source checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Continuously fill verified source queue
        run: |
          priority_args=()
          IFS=',' read -ra film_ids <<< "$PRIORITY_FILM_IDS"
          for film_id in "${film_ids[@]}"; do
            [[ -z "$film_id" ]] && continue
            [[ "$film_id" =~ ^[0-9]+$ ]] || exit 1
            priority_args+=(--priority-film-id "$film_id")
          done
          sdilej-sync prepare --limit 200 --max-scan 2000 \
            --prepare-workers 3 --prepare-runtime-minutes 330 \
            --persist-git-state "${priority_args[@]}"

  handoff:
    needs: prepare
    if: always() && !cancelled() && vars.CONTINUOUS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Back off after a failed runner
        if: needs.prepare.result == 'failure'
        run: sleep 60
      - name: Explicitly resume pipeline supervision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run pipeline-health.yml --repo "$GITHUB_REPOSITORY"
          --ref main -f completed_run_id="$GITHUB_RUN_ID"
